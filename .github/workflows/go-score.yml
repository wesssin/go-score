name: Go Score

on:
  schedule:
    # GitHub uses UTC. These are 5 AM, 11 AM, 5 PM and 11 PM Hawaii time.
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "standard = normal run with push; penguin-bank = also build the detailed Penguin Bank forecast (no push)"
        type: choice
        options: [standard, penguin-bank]
        default: standard

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: go-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Go Score
        env:
          HCDP_API_TOKEN: ${{ secrets.HCDP_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MODE: ${{ inputs.mode || 'standard' }}
        run: |
          mkdir -p site cache
          if [ "$MODE" = "penguin-bank" ]; then ARGS="--penguin"; else ARGS="--notify"; fi
          python go_score.py --out site/index.html $ARGS 2>&1 | tee cache/last_run.log
      - name: Save forecast history and model cache
        run: |
          git config user.name "go-score-bot"
          git config user.email "go-score-bot@users.noreply.github.com"
          for d in forecast_history cache penguin; do [ -d "$d" ] && git add "$d"; done
          git commit -m "Forecast snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new to save"
          git pull --rebase -X theirs -q || git rebase --abort
          git push || echo "push skipped"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: score
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
