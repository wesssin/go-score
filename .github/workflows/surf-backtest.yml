name: Surf backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day (YYYY-MM-DD), blank = 2025-01-01"
        required: false
      spot:
        description: "nct or manana"
        required: false
        default: nct
      end:
        description: "Last day (YYYY-MM-DD), blank = 2 days ago"
        required: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the surf backtest
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          SPOT: ${{ inputs.spot }}
        run: |
          mkdir -p backtest
          python surf_backtest.py 2>&1 | tee backtest/surf_backtest_${{ inputs.spot }}_log.txt
      - name: Save results
        if: always()
        run: |
          git config user.name "go-score-bot"
          git config user.email "go-score-bot@users.noreply.github.com"
          git add backtest
          git commit -m "Surf backtest $(date -u +%Y-%m-%d)" || echo "nothing new"
          git pull --rebase -q || true
          git push
